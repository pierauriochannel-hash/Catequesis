<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notas Secretas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6; /* bg-gray-100 */
        }

        /* Modal transitions */
        .modal-enter {
            opacity: 0;
            transform: scale(0.9);
        }
        .modal-enter-active {
            opacity: 1;
            transform: scale(1);
            transition: opacity 300ms, transform 300ms;
        }
        .modal-exit {
            opacity: 1;
            transform: scale(1);
        }
        .modal-exit-active {
            opacity: 0;
            transform: scale(0.9);
            transition: opacity 300ms, transform 300ms;
        }
    </style>
</head>
<body class="min-h-screen text-gray-800 relative pb-24">

    <!-- Header / Title -->
    <header class="bg-white shadow-sm py-6 px-4 mb-8 text-center">
        <h1 class="text-3xl font-bold text-gray-900 tracking-tight">Respuestas Catequesis</h1>
    </header>

    <!-- Main Container for Cards -->
    <main id="cards-container" class="max-w-3xl mx-auto px-4 flex flex-col gap-4">
        <!-- Cards will be injected here by JavaScript -->
    </main>

    <!-- Floating Action Button (+) -->
    <button id="fab-btn" class="fixed top-6 right-6 bg-blue-600 hover:bg-blue-700 text-white rounded-full w-14 h-14 flex items-center justify-center text-3xl shadow-lg transition-transform hover:scale-105 active:scale-95 z-40 focus:outline-none focus:ring-4 focus:ring-blue-300">
        +
    </button>

    <!-- Modal Overlay -->
    <div id="modal-overlay" class="fixed inset-0 bg-gray-900/60 backdrop-blur-sm z-50 hidden flex-col items-center justify-center p-4">
        
        <!-- Modal Content Box -->
        <div id="modal-content" class="bg-white rounded-2xl shadow-2xl w-full max-w-md overflow-hidden opacity-0 scale-90 transition-all duration-300">
            
            <!-- Header of Modal with Close Button -->
            <div class="flex justify-between items-center px-6 py-4 border-b">
                <h2 id="modal-title" class="text-xl font-semibold text-gray-800">Autenticación</h2>
                <button id="close-modal-btn" class="text-gray-400 hover:text-gray-600 focus:outline-none text-2xl leading-none">&times;</button>
            </div>

            <div class="p-6">
                <!-- Section 1: Code Entry -->
                <div id="code-section" class="block">
                    <p class="text-sm text-gray-600 mb-4">Por favor, ingresa el código de acceso para continuar.</p>
                    <div class="mb-4">
                        <input type="password" id="secret-code" placeholder="Ingresa el código" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors outline-none text-center tracking-[0.5em] text-lg font-mono">
                        <p id="code-error" class="text-red-500 text-sm mt-2 hidden">Código incorrecto. Inténtalo de nuevo.</p>
                    </div>
                    <button id="verify-code-btn" class="w-full bg-gray-800 hover:bg-gray-900 text-white font-medium py-3 rounded-lg transition-colors focus:outline-none focus:ring-4 focus:ring-gray-300">
                        Verificar
                    </button>
                </div>

                <!-- Section 2: Form Entry (Hidden by default) -->
                <div id="form-section" class="hidden">
                    <div class="mb-4">
                        <label for="entry-title" class="block text-sm font-medium text-gray-700 mb-1">Título</label>
                        <input type="text" id="entry-title" placeholder="Ej. Mi nueva idea..." class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-colors">
                    </div>
                    <div class="mb-5">
                        <label for="entry-text" class="block text-sm font-medium text-gray-700 mb-1">Texto</label>
                        <textarea id="entry-text" rows="5" placeholder="Escribe el contenido detallado aquí..." class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-colors resize-none"></textarea>
                    </div>
                    <button id="add-entry-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 rounded-lg transition-colors focus:outline-none focus:ring-4 focus:ring-blue-300">
                        Añadir
                    </button>
                </div>
            </div>

        </div>
    </div>

    <!-- View Modal Overlay (New window for viewing notes) -->
    <div id="view-modal-overlay" class="fixed inset-0 bg-gray-900/60 backdrop-blur-sm z-50 hidden flex-col items-center justify-center p-4">
        <div id="view-modal-content" class="bg-white rounded-2xl shadow-2xl w-full max-w-md overflow-hidden opacity-0 scale-90 transition-all duration-300">
            <div class="flex justify-between items-center px-6 py-4 border-b">
                <h2 id="view-modal-title" class="text-xl font-semibold text-gray-800"></h2>
                <button id="close-view-btn" class="text-gray-400 hover:text-gray-600 focus:outline-none text-2xl leading-none">&times;</button>
            </div>
            <div class="p-6 max-h-[70vh] overflow-y-auto">
                <p id="view-modal-text" class="text-gray-600 leading-relaxed whitespace-pre-wrap"></p>
            </div>
        </div>
    </div>

    <!-- Delete Modal Overlay -->
    <div id="delete-modal-overlay" class="fixed inset-0 bg-gray-900/60 backdrop-blur-sm z-50 hidden flex-col items-center justify-center p-4">
        <div id="delete-modal-content" class="bg-white rounded-2xl shadow-2xl w-full max-w-sm overflow-hidden opacity-0 scale-90 transition-all duration-300">
            <div class="flex justify-between items-center px-6 py-4 border-b">
                <h2 class="text-xl font-semibold text-gray-800">Eliminar Entrada</h2>
                <button id="close-delete-btn" class="text-gray-400 hover:text-gray-600 focus:outline-none text-2xl leading-none">&times;</button>
            </div>
            <div class="p-6">
                <p class="text-sm text-gray-600 mb-4">Ingresa el código para eliminar esta entrada.</p>
                <div class="mb-4">
                    <input type="password" id="delete-secret-code" placeholder="Código" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-500 focus:border-red-500 transition-colors outline-none text-center tracking-[0.5em] text-lg font-mono">
                    <p id="delete-code-error" class="text-red-500 text-sm mt-2 hidden">Código incorrecto.</p>
                </div>
                <button id="confirm-delete-btn" class="w-full bg-red-600 hover:bg-red-700 text-white font-medium py-3 rounded-lg transition-colors focus:outline-none focus:ring-4 focus:ring-red-300">
                    Eliminar
                </button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, addDoc, deleteDoc, onSnapshot, collection } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // --- Firebase Configuration ---
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'secret-notes-app';
        let firebaseConfig = {};
        try {
            if (typeof __firebase_config !== 'undefined') firebaseConfig = JSON.parse(__firebase_config);
        } catch (e) {
            console.warn("Invalid firebase config");
        }

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        let currentUser = null;

        document.addEventListener('DOMContentLoaded', () => {
            // --- State ---
            let isAuthenticated = false; // As requested, reset on close
            let idToDelete = null;

            // --- DOM Elements ---
            const fabBtn = document.getElementById('fab-btn');
            const modalOverlay = document.getElementById('modal-overlay');
            const modalContent = document.getElementById('modal-content');
            const closeModalBtn = document.getElementById('close-modal-btn');
            const modalTitle = document.getElementById('modal-title');
            
            const codeSection = document.getElementById('code-section');
            const formSection = document.getElementById('form-section');
            const secretCodeInput = document.getElementById('secret-code');
            const verifyCodeBtn = document.getElementById('verify-code-btn');
            const codeError = document.getElementById('code-error');

            const entryTitleInput = document.getElementById('entry-title');
            const entryTextInput = document.getElementById('entry-text');
            const addEntryBtn = document.getElementById('add-entry-btn');
            const cardsContainer = document.getElementById('cards-container');

            // View Modal Elements
            const viewModalOverlay = document.getElementById('view-modal-overlay');
            const viewModalContent = document.getElementById('view-modal-content');
            const closeViewBtn = document.getElementById('close-view-btn');
            const viewModalTitle = document.getElementById('view-modal-title');
            const viewModalText = document.getElementById('view-modal-text');

            // Delete Modal Elements
            const deleteModalOverlay = document.getElementById('delete-modal-overlay');
            const deleteModalContent = document.getElementById('delete-modal-content');
            const closeDeleteBtn = document.getElementById('close-delete-btn');
            const confirmDeleteBtn = document.getElementById('confirm-delete-btn');
            const deleteSecretCodeInput = document.getElementById('delete-secret-code');
            const deleteCodeError = document.getElementById('delete-code-error');

            // --- Authentication ---
            const initAuth = async () => {
                try {
                    if (typeof __initial_auth_token !== 'undefined') {
                        await signInWithCustomToken(auth, __initial_auth_token);
                    } else {
                        await signInAnonymously(auth);
                    }
                    currentUser = auth.currentUser;
                    loadCards();
                } catch (error) {
                    console.error("Auth error:", error);
                }
            };

            const loadCards = () => {
                if (!currentUser) return;
                // Path uses user's UID to keep data strictly private to their session
                const notesRef = collection(db, 'artifacts', appId, 'users', currentUser.uid, 'notes');
                onSnapshot(notesRef, (snapshot) => {
                    cardsContainer.innerHTML = ''; // Clear and re-render
                    const docs = [];
                    snapshot.forEach(doc => docs.push({ id: doc.id, ...doc.data() }));
                    
                    // Sort locally so newer notes stay on top
                    docs.sort((a, b) => b.createdAt - a.createdAt);
                    
                    docs.forEach(data => {
                        createCard(data.id, data.title, data.text);
                    });
                }, (error) => {
                    console.error("Error loading notes", error);
                });
            };

            // Start Firebase auth and load
            initAuth();

            // --- Form Modal Functions ---
            const openModal = () => {
                modalOverlay.classList.remove('hidden');
                modalOverlay.classList.add('flex');
                
                setTimeout(() => {
                    modalContent.classList.remove('opacity-0', 'scale-90');
                    modalContent.classList.add('opacity-100', 'scale-100');
                }, 10);

                if (isAuthenticated) {
                    showFormSection();
                } else {
                    showCodeSection();
                }
            };

            const closeModal = () => {
                modalContent.classList.remove('opacity-100', 'scale-100');
                modalContent.classList.add('opacity-0', 'scale-90');
                
                setTimeout(() => {
                    modalOverlay.classList.add('hidden');
                    modalOverlay.classList.remove('flex');
                    isAuthenticated = false; // Reset authentication on close!
                    resetModalStates();
                }, 300);
            };

            const resetModalStates = () => {
                secretCodeInput.value = '';
                codeError.classList.add('hidden');
                entryTitleInput.value = '';
                entryTextInput.value = '';
            };

            const showFormSection = () => {
                codeSection.classList.add('hidden');
                formSection.classList.remove('hidden');
                modalTitle.textContent = 'Nueva Entrada'; 
                setTimeout(() => entryTitleInput.focus(), 100);
            };

            const showCodeSection = () => {
                formSection.classList.add('hidden');
                codeSection.classList.remove('hidden');
                modalTitle.textContent = 'Autenticación';
                setTimeout(() => secretCodeInput.focus(), 100);
            };

            const checkCode = () => {
                const code = secretCodeInput.value.trim();
                if (code === '6769') {
                    isAuthenticated = true;
                    codeError.classList.add('hidden');
                    codeSection.style.opacity = '0';
                    setTimeout(() => {
                        showFormSection();
                        codeSection.style.opacity = '1';
                    }, 200);
                } else {
                    codeError.classList.remove('hidden');
                    secretCodeInput.classList.add('border-red-500', 'ring-red-500');
                    setTimeout(() => {
                        secretCodeInput.classList.remove('border-red-500', 'ring-red-500');
                    }, 2000);
                }
            };

            const addEntry = async () => {
                const title = entryTitleInput.value.trim();
                const text = entryTextInput.value.trim();

                if (!title || !text || !currentUser) {
                    if (!title) entryTitleInput.classList.add('border-red-500');
                    if (!text) entryTextInput.classList.add('border-red-500');
                    setTimeout(() => {
                        entryTitleInput.classList.remove('border-red-500');
                        entryTextInput.classList.remove('border-red-500');
                    }, 2000);
                    return;
                }

                try {
                    // Save persistently to Firestore
                    const notesRef = collection(db, 'artifacts', appId, 'users', currentUser.uid, 'notes');
                    await addDoc(notesRef, {
                        title,
                        text,
                        createdAt: Date.now()
                    });
                    closeModal();
                } catch(e) {
                    console.error("Error adding entry", e);
                }
            };

            // --- View Modal Functions ---
            const openViewModal = (title, text) => {
                viewModalTitle.textContent = title;
                viewModalText.textContent = text;
                
                viewModalOverlay.classList.remove('hidden');
                viewModalOverlay.classList.add('flex');
                setTimeout(() => {
                    viewModalContent.classList.remove('opacity-0', 'scale-90');
                    viewModalContent.classList.add('opacity-100', 'scale-100');
                }, 10);
            };

            const closeViewModal = () => {
                viewModalContent.classList.remove('opacity-100', 'scale-100');
                viewModalContent.classList.add('opacity-0', 'scale-90');
                setTimeout(() => {
                    viewModalOverlay.classList.add('hidden');
                    viewModalOverlay.classList.remove('flex');
                }, 300);
            };

            // --- Delete Modal Functions ---
            const openDeleteModal = (id) => {
                idToDelete = id;
                deleteSecretCodeInput.value = '';
                deleteCodeError.classList.add('hidden');
                
                deleteModalOverlay.classList.remove('hidden');
                deleteModalOverlay.classList.add('flex');
                setTimeout(() => {
                    deleteModalContent.classList.remove('opacity-0', 'scale-90');
                    deleteModalContent.classList.add('opacity-100', 'scale-100');
                    deleteSecretCodeInput.focus();
                }, 10);
            };

            const closeDeleteModal = () => {
                deleteModalContent.classList.remove('opacity-100', 'scale-100');
                deleteModalContent.classList.add('opacity-0', 'scale-90');
                setTimeout(() => {
                    deleteModalOverlay.classList.add('hidden');
                    deleteModalOverlay.classList.remove('flex');
                    idToDelete = null;
                }, 300);
            };

            const handleDeleteCheck = async () => {
                const code = deleteSecretCodeInput.value.trim();
                if (code === '6769') {
                    if (idToDelete && currentUser) {
                        try {
                            // Delete from Firestore
                            await deleteDoc(doc(db, 'artifacts', appId, 'users', currentUser.uid, 'notes', idToDelete));
                            closeDeleteModal();
                        } catch(e) {
                            console.error("Error deleting doc", e);
                        }
                    }
                } else {
                    deleteCodeError.classList.remove('hidden');
                    deleteSecretCodeInput.classList.add('border-red-500', 'ring-red-500');
                    setTimeout(() => {
                        deleteSecretCodeInput.classList.remove('border-red-500', 'ring-red-500');
                    }, 2000);
                }
            };

            // --- Card Creation Logic ---
            const createCard = (id, title, text) => {
                const card = document.createElement('div');
                card.className = 'bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden hover:shadow-md transition-shadow flex items-stretch group';
                
                // The clickable text area
                const contentArea = document.createElement('div');
                contentArea.className = 'flex-1 px-6 py-5 cursor-pointer';
                contentArea.innerHTML = `<h3 class="font-semibold text-lg text-gray-800">${escapeHTML(title)}</h3>`;
                contentArea.addEventListener('click', () => {
                    openViewModal(title, text);
                });

                // The delete button corner
                const deleteBtnContainer = document.createElement('div');
                deleteBtnContainer.className = 'flex items-center justify-center px-4 border-l border-gray-100 bg-gray-50 hover:bg-red-50 transition-colors cursor-pointer text-gray-400 hover:text-red-500';
                deleteBtnContainer.innerHTML = `<span class="text-2xl leading-none" title="Borrar">&times;</span>`;
                deleteBtnContainer.addEventListener('click', (e) => {
                    e.stopPropagation(); // Prevents the click from triggering the view modal
                    openDeleteModal(id);
                });

                card.appendChild(contentArea);
                card.appendChild(deleteBtnContainer);
                cardsContainer.appendChild(card);
            };

            const escapeHTML = (str) => {
                const div = document.createElement('div');
                div.textContent = str;
                return div.innerHTML;
            };

            // --- Attach Event Listeners ---
            fabBtn.addEventListener('click', openModal);
            closeModalBtn.addEventListener('click', closeModal);
            modalOverlay.addEventListener('click', (e) => {
                if (e.target === modalOverlay) closeModal();
            });
            verifyCodeBtn.addEventListener('click', checkCode);
            secretCodeInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') checkCode();
            });
            addEntryBtn.addEventListener('click', addEntry);

            closeViewBtn.addEventListener('click', closeViewModal);
            viewModalOverlay.addEventListener('click', (e) => {
                if (e.target === viewModalOverlay) closeViewModal();
            });

            closeDeleteBtn.addEventListener('click', closeDeleteModal);
            deleteModalOverlay.addEventListener('click', (e) => {
                if (e.target === deleteModalOverlay) closeDeleteModal();
            });
            confirmDeleteBtn.addEventListener('click', handleDeleteCheck);
            deleteSecretCodeInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') handleDeleteCheck();
            });
        });
    </script>
</body>
</html>
